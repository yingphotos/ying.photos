  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "GenYoMin TC", "GenYoMinTC-Regular", "Noto Serif TC", serif;
      background: #f5f4f3;
      color: #111111;
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 全螢幕轉場白幕 */
    .page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f5f4f3;
      z-index: 9999;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .page-transition-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* 固定頁首導覽列 */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      mix-blend-mode: difference;
      color: white;
    }

    nav .logo {
      font-size: 15px;
      letter-spacing: 0.08em;
      font-family: "Cormorant Garamond", serif;
    }

    .back-btn {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.6;
    }

    /* 專題 Header 區塊 */
    .project-hero {
      padding: 140px 32px 32px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .project-header {
      margin-bottom: 0;
    }

    .project-title {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .project-date {
      font-size: 14px;
      color: #666;
      font-family: Arial, sans-serif;
      letter-spacing: 0.05em;
    }

    /* 專題主文章容器 */
    .story-article {
      width: 100%;
      padding: 0 0 60px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* 圖文敘事單元 */
    .story-block {
      display: flex;
      flex-direction: column;
      width: 100%;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 2s cubic-bezier(0.16, 1, 0.3, 1), transform 2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .story-block.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 頂部純文字區塊 */
    .intro-text-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 32px 60px;
      width: 100%;
    }

    .story-text {
      font-size: 18px;
      line-height: 2;
      color: #2c2c2c;
      letter-spacing: 0.05em;
      width: 100%;
    }

    .story-text p {
      margin-bottom: 24px;
    }

    .story-text p:last-child {
      margin-bottom: 0;
    }

    /* 單張大圖 (滿版、無縫) */
    .story-image-single {
      width: 100%;
      background: #e8e8e8;
      overflow: hidden;
    }

    .story-image-single img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 雙圖並排容器 (無縫隙貼合) */
    .story-image-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      width: 100%;
    }

    .story-image-grid-2 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #e8e8e8;
    }

    /* 特殊非對稱組合：左直 + 右雙橫上下堆疊 */
    .asymmetric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      width: 100%;
    }

    .asymmetric-left {
      width: 100%;
      height: 100%;
    }

    .asymmetric-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #e8e8e8;
    }

    .asymmetric-right-stack {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .asymmetric-right-stack img {
      width: 100%;
      height: 50%;
      object-fit: cover;
      display: block;
      background: #e8e8e8;
    }

      min-height: 300px;

      content: "IMAGE MISSING";

    /* 推薦區塊 (MORE WORKS) */

    .recommend-image {

    .recommend-image img {

    /* 圖片 Hover 微放大效果 */

    /* Lightbox Modal */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: 10000;

      justify-content: center;

    .image-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .image-modal img {

      max-height: 92vh;
      object-fit: contain;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);

    .image-modal.active img {

    .image-modal-close {

      }

      .asymmetric-right-stack img {
        height: auto;
      }

      .recommend-grid {
        grid-template-columns: 1fr;
      }
    }

        <p>艋舺龍山寺旁的西昌街在黃昏之際，搖身變為沿街一字排開的舊貨市集。空氣瀰漫濃濃的菸味和喧囂，此時的西昌街宛如穿越時空，回到泛黃的八零年代。老人、遊民在市集和茶室間穿梭，與老友沒有終點地聊天；也有人四處尋寶殺價，捕獵屬於自己的戰利品。這裡活絡奇特的氛圍，讓人感覺一切都有可能發生。</p>
        <p>西昌街走入了黃昏，這些人的生命亦然，但是日落之際的西昌街，卻燃起了一份其他地方未有的生機。</p>

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // 捲動淡入效果
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.story-block').forEach(el => observer.observe(el));

    // 頁面轉場淡入
    const overlay = document.getElementById('transition-overlay');

    window.addEventListener('DOMContentLoaded', () => {
      window.scrollTo(0, 0);
      setTimeout(() => {
        if (overlay) overlay.classList.add('hidden');
      }, 100);
    });

    window.addEventListener('pageshow', () => {
      if (overlay) overlay.classList.add('hidden');
    });

    // 動態綁定轉場動畫至連結
    function bindTransitionLinks() {
      document.querySelectorAll('a[href]').forEach(anchor => {
        const href = anchor.getAttribute('href');
        const target = anchor.getAttribute('target');

        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && target !== '_blank') {
          anchor.addEventListener('click', function (e) {
            e.preventDefault();

            if (overlay) {
              overlay.classList.remove('hidden');
              setTimeout(() => {
                window.location.href = href;
              }, 350);
            } else {
              window.location.href = href;
            }
          });
        }
      });
    }

    // 動態推薦專案（包含全 10 個作品，自動排除當前頁面 work-10）
    const CURRENT_WORK_ID = "work-10";

    const allProjects = [
     { id: "work-1", title: "老鐵舖的餘溫", date: "2025.04.14", url: "work-1.html", cover: "./images/work-1/work-1-16.jpg" },
      { id: "work-2", title: "2025馬祖國際藝術島", date: "2025.11.07-10", url: "work-2.html", cover: "./images/work-2/work-2-29.jpg" },
      { id: "work-3", title: "228・0紀念行動", date: "2026.02.27", url: "work-3.html", cover: "./images/work-3/work-3-7.jpg" },
      { id: "work-4", title: "台北迎城隍系列", date: "2026.06.25、27", url: "work-4.html", cover: "./images/work-4/暗訪夜巡-1.jpg" },
      { id: "work-5", title: "與大道公等雨", date: "2026.06.22", url: "work-5.html", cover: "./images/work-5/work-5.jpg" },
      { id: "work-6", title: "浪漫屋", date: "2026.07.06", url: "work-6.html", cover: "./images/work-6/work-6-1.jpg" },
      { id: "work-11", title: "發美皮鞋店", date: "2025.05.03", url: "work-11.html", cover: "./images/work-11/work-11-1.jpg" },
      { id: "work-12", title: "台日友好 青森睡魔抵嘉", date: "2026.02.07 / 03.06", url: "work-12.html", cover: "./images/work-12/work-12-1.jpg" },
      { id: "work-13", title: "鹿港國際龍舟錦標賽", date: "2026.06.19", url: "work-13.html", cover: "./images/work-13/work-13-1.jpg" },
      { id: "work-14", title: "雞籠中元祭", date: "2026.06.19", url: "work-14.html", cover: "./images/work-14/work-14-1.jpg" },
      { id: "work-15", title: "溪洲記事：溪洲部落豐年祭", date: "2026.07/08", url: "work-15-index.html", cover: "./images/work-15/work-15-4-29.jpg" },
      { id: "work-16", title: "跟著《臺灣漫遊錄》吃遍台灣", date: "2026", url: "work-16-index.html", cover: "./images/work-16/work-16-1.jpg" },
      { id: "work-17", title: "日進花影 活水營新竹篇", date: "2026.05.14", url: "work-17.html", cover: "./images/work-17/work-17-1.jpg" },
      { id: "work-18", title: "青鳥運動", date: "2024.05", url: "work-18.html", cover: "./images/work-18/work-18-1.jpg" }
    ];

    function renderRecommendations() {
      const otherProjects = allProjects.filter(p => p.id !== CURRENT_WORK_ID);
      for (let i = otherProjects.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [otherProjects[i], otherProjects[j]] = [otherProjects[j], otherProjects[i]];
      }

      const selected = otherProjects.slice(0, 4);

      const grid = document.getElementById('recommend-grid');
      if (!grid) return;

      grid.innerHTML = selected.map(p => `
        <a href="${p.url}" class="recommend-card">
          <div class="recommend-image">
            <img src="${p.cover}" alt="${p.title}" onerror="this.parentNode.classList.add('image-placeholder')">
          </div>
          <div class="recommend-info">
            <h3 class="recommend-info-title">${p.title}</h3>
            <span class="recommend-info-date">${p.date}</span>
          </div>
        </a>
      `).join('');

      bindTransitionLinks();
    }

    renderRecommendations();

    // Lightbox Modal 控制
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('image-modal-img');
    const modalClose = document.getElementById('image-modal-close');

    document.querySelectorAll('.story-article img').forEach(img => {
      img.addEventListener('click', () => {
        if (img.src) {
          modalImg.src = img.src;
          modalImg.alt = img.alt || '';
          modal.classList.add('active');
        }
      });
    });

    function closeModal() {
      modal.classList.remove('active');
    }

    if (modal) modal.addEventListener('click', closeModal);
    if (modalClose) modalClose.addEventListener('click', closeModal);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
