<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@p3ol/gen-yo-min-tc@1.0.0/index.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "GenYoMin TC", "GenYoMinTC-Regular", "Noto Serif TC", serif;
      background: #f5f4f3;
      color: #111111;
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 全螢幕轉場白幕 */
    .page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f5f4f3;
      z-index: 9999;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .page-transition-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* 固定頁首導覽列 */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      mix-blend-mode: difference;
      color: white;
    }

    nav .logo {
      font-size: 15px;
      letter-spacing: 0.08em;
      font-family: "Cormorant Garamond", serif;
    }

    .back-btn {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.6;
    }

    /* 專題 Header 區塊 */
    .project-hero {
      padding: 140px 32px 16px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .project-header {
      margin-bottom: 0;
    }

    .project-title {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .project-date {
      font-size: 14px;
      color: #666;
      font-family: Arial, sans-serif;
      letter-spacing: 0.05em;
    }

    /* 專題主文章容器 */
    .story-article {
      width: 100%;
      padding: 0 0 60px;
      display: flex;
      flex-direction: column;
      gap: 0; /* 圖片塊之間完全無縫 */
    }

    /* 圖文敘事單元 */
    .story-block {
      display: flex;
      flex-direction: column;
      width: 100%;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 2s cubic-bezier(0.16, 1, 0.3, 1), transform 2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .story-block.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 純文字對齊容器 (專門處理介紹文字與標題，使其精準對齊 1000px 框架) */
    .story-text-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 32px; /* 縮減與大標題之間的留白 */
      width: 100%;
    }

    /* 章節大標題 */
    .section-title {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.06em;
      border-bottom: 1px solid #d5d4d3;
      padding-bottom: 12px;
      margin-top: 20px;
    }

    /* 影片與文字並排單元 */
    .media-intro-block {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 32px;
      display: grid;
      grid-template-columns: 315px 1fr; /* 精準限制 Shorts 影片寬度 */
      gap: 40px;
      align-items: center;
      width: 100%;
    }

    /* 精準符合 9:16 比例之影片容器 */
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16; /* 強制直向 9:16，徹底消除左右黑邊 */
      background: #000;
      border-radius: 4px;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* 單張大圖 (滿版、無縫) */
    .story-image-single {
      width: 100%;
      background: #e8e8e8;
      overflow: hidden;
    }

    .story-image-single img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 雙圖並排容器 (縫隙為0，完美貼合) */
    .story-image-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0; /* 圖片貼合無縫隙 */
      width: 100%;
    }

    .story-image-grid-2 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #e8e8e8;
    }

    /* 文章段落字型 */
    .story-text {
      font-size: 19px;
      line-height: 2.1;
      color: #2c2c2c;
      letter-spacing: 0.05em;
      width: 100%;
    }

    .story-text p {
      margin-bottom: 12px;
    }

    .story-text p:last-child {
      margin-bottom: 0;
    }

    /* 占位符樣式 */
    .image-placeholder {
      position: relative;
      min-height: 400px;
    }

    .image-placeholder::after {
      content: "IMAGE MISSING";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #999;
    }

    /* 底部導覽按鈕區 */
    .project-footer-nav {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 32px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .nav-link-next {
      text-align: right;
    }

    .nav-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #888;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .nav-title {
      font-size: 18px;
      color: #111;
      transition: opacity 0.3s ease;
      line-height: 1.2;
    }

    .nav-title:hover {
      opacity: 0.5;
    }

    /* 推薦區塊 */
    .recommend-section {
      padding: 80px 32px 120px;
      border-top: 1px solid #e0dfdd;
      max-width: 1000px;
      margin: 0 auto;
    }

    .recommend-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(32px, 4vw, 48px);
      margin-bottom: 32px;
      font-weight: 400;
    }

    .recommend-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .recommend-card {
      display: block;
    }

    .recommend-image {
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #e8e8e8;
      margin-bottom: 16px;
    }

    .recommend-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .recommend-card:hover .recommend-image img {
      transform: scale(1.05);
    }

    .recommend-info-title {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 4px;
    }

    .recommend-info-date {
      font-size: 12px;
      color: #777;
    }

    /* 圖片 Hover 微放大效果 */
    .story-article img {
      cursor: zoom-in;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .story-article img:hover {
      transform: scale(1.01);
    }

    /* Lightbox Modal */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: zoom-out;
      padding: 40px;
    }

    .image-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .image-modal img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      transform: scale(0.96);
    }

    .image-modal.active img {
      transform: scale(1);
    }

    .image-modal-close {
      position: absolute;
      top: 28px;
      right: 32px;
      font-size: 28px;
      font-weight: 300;
      color: #ffffff;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.3s ease;
      user-select: none;
    }

    .image-modal-close:hover {
      opacity: 1;
    }

    /* RWD 手機版樣式 */
    @media (max-width: 768px) {
      nav, .project-hero, .story-text-container, .project-footer-nav, .recommend-section {
        padding-left: 20px;
        padding-right: 20px;
      }

      .project-hero {
        padding-top: 110px;
        padding-bottom: 20px;
      }

      .story-text {
        font-size: 16px;
        line-height: 1.95;
      }

      .media-intro-block {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 20px;
      }

      .story-image-grid-2 {
        grid-template-columns: 1fr;
      }

      .recommend-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

          <img src="./images/work-4/work-4-19.jpg" alt="正日繞境 work-4-19" onerror="this.classList.add('image-placeholder')">
          <img src="./images/work-4/work-4-20.jpg" alt="正日繞境 work-4-20" onerror="this.classList.add('image-placeholder')">
        </div>
      </section>

      <section class="story-block">
        <div class="story-image-grid-2">
          <img src="./images/work-4/work-4-21.jpg" alt="正日繞境 work-4-21" onerror="this.classList.add('image-placeholder')">
          <img src="./images/work-4/work-4-22.jpg" alt="正日繞境 work-4-22" onerror="this.classList.add('image-placeholder')">
        </div>
      </section>

    </article>

    <!-- 頁尾導覽按鈕區 -->
    <footer class="project-footer-nav">
      <span class="back-btn" onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">↑ Back to Top</span>
    </footer>

    <!-- 隨機推薦專案區塊 (MORE WORKS) -->
    <section class="recommend-section">
      <h2 class="recommend-title">More Works</h2>
      <div class="recommend-grid" id="recommend-grid">
      </div>
    </section>
  </main>

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // 捲動淡入效果
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.story-block').forEach(el => observer.observe(el));

    // 頁面轉場淡入
    const overlay = document.getElementById('transition-overlay');

    window.addEventListener('DOMContentLoaded', () => {
      window.scrollTo(0, 0);
      setTimeout(() => {
        if (overlay) overlay.classList.add('hidden');
      }, 100);
    });

    window.addEventListener('pageshow', () => {
      if (overlay) overlay.classList.add('hidden');
    });

    // 動態綁定轉場動畫至連結
    function bindTransitionLinks() {
      document.querySelectorAll('a[href]').forEach(anchor => {
        const href = anchor.getAttribute('href');
        const target = anchor.getAttribute('target');

        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && target !== '_blank') {
          anchor.addEventListener('click', function (e) {
            e.preventDefault();

            if (overlay) {
              overlay.classList.remove('hidden');
              setTimeout(() => {
                window.location.href = href;
              }, 350);
            } else {
              window.location.href = href;
            }
          });
        }
      });
    }

    // 動態推薦專案（排除當前頁面，隨機抽最多 4 個）
    const CURRENT_WORK_ID = "work-4";

    const allProjects = [
      { id: "work-1", title: "老鐵舖的餘溫", date: "2025.04.14", url: "work-1.html", cover: "./images/work-1/work-1-16.jpg" },
      { id: "work-2", title: "2025馬祖國際藝術島", date: "2025.11.07-10", url: "work-2.html", cover: "./images/work-2/work-2-29.jpg" },
      { id: "work-3", title: "228・0紀念行動", date: "2026.02.27", url: "work-3.html", cover: "./images/work-3/work-3-7.jpg" },
      { id: "work-4", title: "台北迎城隍系列", date: "2026.06.25、27", url: "work-4.html", cover: "./images/work-4/暗訪夜巡-1.jpg" },
      { id: "work-5", title: "與大道公等雨", date: "2026.06.22", url: "work-5.html", cover: "./images/work-5/work-5.jpg" },
      { id: "work-6", title: "浪漫屋", date: "2026.07.06", url: "work-6.html", cover: "./images/work-6/work-6-1.jpg" },
      { id: "work-11", title: "發美皮鞋店", date: "2025.05.03", url: "work-11.html", cover: "./images/work-11/work-11-1.jpg" },
      { id: "work-12", title: "台日友好 青森睡魔抵嘉", date: "2026.02.07 / 03.06", url: "work-12.html", cover: "./images/work-12/work-12-1.jpg" },
      { id: "work-13", title: "鹿港國際龍舟錦標賽", date: "2026.06.19", url: "work-13.html", cover: "./images/work-13/work-13-1.jpg" },
      { id: "work-14", title: "雞籠中元祭", date: "2026.06.19", url: "work-14.html", cover: "./images/work-14/work-14-1.jpg" },
      { id: "work-15", title: "溪洲記事：溪洲部落豐年祭", date: "2026.07/08", url: "work-15-index.html", cover: "./images/work-15/work-15-4-29.jpg" },
      { id: "work-16", title: "跟著《臺灣漫遊錄》吃遍台灣", date: "2026", url: "work-16-index.html", cover: "./images/work-16/work-16-1.jpg" },
      { id: "work-17", title: "日進花影 活水營新竹篇", date: "2026.05.14", url: "work-17.html", cover: "./images/work-17/work-17-1.jpg" },
      { id: "work-18", title: "青鳥運動", date: "2024.05", url: "work-18.html", cover: "./images/work-18/work-18-1.jpg" }
    ];

    function renderRecommendations() {
      const otherProjects = allProjects.filter(p => p.id !== CURRENT_WORK_ID);
      for (let i = otherProjects.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [otherProjects[i], otherProjects[j]] = [otherProjects[j], otherProjects[i]];
      }

      const selected = otherProjects.slice(0, 4);

      const grid = document.getElementById('recommend-grid');
      if (!grid) return;

      grid.innerHTML = selected.map(p => `
        <a href="${p.url}" class="recommend-card">
          <div class="recommend-image">
            <img src="${p.cover}" alt="${p.title}" onerror="this.parentNode.classList.add('image-placeholder')">
          </div>
          <div class="recommend-info">
            <h3 class="recommend-info-title">${p.title}</h3>
            <span class="recommend-info-date">${p.date}</span>
          </div>
        </a>
      `).join('');

      bindTransitionLinks();
    }

    renderRecommendations();

    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('image-modal-img');
    const modalClose = document.getElementById('image-modal-close');

    document.querySelectorAll('.story-article img').forEach(img => {
      img.addEventListener('click', () => {
        if (img.src) {
          modalImg.src = img.src;
          modalImg.alt = img.alt || '';
          modal.classList.add('active');
        }
      });
    });

    function closeModal() {
      modal.classList.remove('active');
    }

    if (modal) modal.addEventListener('click', closeModal);
    if (modalClose) modalClose.addEventListener('click', closeModal);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      } 
    });
  </script>
</body>
</html>
