<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青鳥運動 — Ying Photos</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@p3ol/gen-yo-min-tc@1.0.0/index.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "GenYoMin TC", "GenYoMinTC-Regular", "Noto Serif TC", serif;
      background: #f5f4f3;
      color: #111111;
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 全螢幕轉場白幕 */
    .page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f5f4f3;
      z-index: 9999;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .page-transition-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* 固定頁首導覽列 */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      mix-blend-mode: difference;
      color: white;
    }

    nav .logo {
      font-size: 15px;
      letter-spacing: 0.08em;
      font-family: "Cormorant Garamond", serif;
    }

    .back-btn {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.6;
    }

    /* 專題 Header 區塊 */
    .project-hero {
      padding: 140px 32px 40px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .project-title {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .project-date {
      font-size: 14px;
      color: #666;
      font-family: Arial, sans-serif;
      letter-spacing: 0.05em;
    }

    /* 圖片畫廊（無縫滿版） */
    .gallery-container {
      width: 100%;
      margin-bottom: 80px;
    }

    .grid-row {
      display: grid;
      width: 100%;
      gap: 0;
    }

    .grid-row.col-1 {
      grid-template-columns: 1fr;
    }

    .grid-row.col-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-row.col-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .photo-item {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #e8e8e8;
      cursor: zoom-in;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .photo-item:hover img {
      transform: scale(1.03);
    }

    /* 底部導覽按鈕區（單向右對齊） */
    .project-footer-nav {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 32px 32px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
    }

    .nav-link-next {
      text-align: right;
    }

    .nav-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #888;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .nav-title {
      font-size: 18px;
      color: #111;
      transition: opacity 0.3s ease;
      line-height: 1.2;
    }

    .nav-title:hover {
      opacity: 0.5;
    }

    /* ---------------------------------------------------- */
    /* 推薦區塊 (2x2 網格樣式) */
    /* ---------------------------------------------------- */
    .recommend-section {
      padding: 80px 32px 120px;
      border-top: 1px solid #e0dfdd;
      max-width: 1000px;
      margin: 0 auto;
    }

    .recommend-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(32px, 4vw, 48px);
      margin-bottom: 32px;
      font-weight: 400;
    }

    .recommend-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .recommend-card {
      display: block;
    }

    .recommend-image {
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #e8e8e8;
      margin-bottom: 16px;
    }

    .recommend-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .recommend-card:hover .recommend-image img {
      transform: scale(1.05);
    }

    .recommend-info-title {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 4px;
    }

    .recommend-info-date {
      font-size: 12px;
      color: #777;
    }

    .image-placeholder {
      position: relative;
      min-height: 400px;
    }

    /* Lightbox Modal */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: zoom-out;
      padding: 40px;
    }

    .image-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .image-modal img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      transform: scale(0.96);
    }

    .image-modal.active img {
      transform: scale(1);
    }

    .image-modal-close {
      position: absolute;
      top: 28px;
      right: 32px;
      font-size: 28px;
      font-weight: 300;
      color: #ffffff;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.3s ease;
      user-select: none;
    }

    .image-modal-close:hover {
      opacity: 1;
    }

    /* RWD 手機版樣式 */
    @media (max-width: 768px) {
      nav, .project-hero, .project-footer-nav, .recommend-section {
        padding-left: 20px;
        padding-right: 20px;
      }

      .project-hero {
        padding-top: 110px;
        padding-bottom: 20px;
      }

      .grid-row.col-2, .grid-row.col-3 {
        grid-template-columns: 1fr;
      }

      .recommend-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page-transition-overlay" id="transition-overlay"></div>

  <!-- 圖片放大 Fullscreen Lightbox Modal -->
  <div class="image-modal" id="image-modal">
    <span class="image-modal-close" id="image-modal-close">✕</span>
    <img src="" alt="" id="image-modal-img">
  </div>

  <nav>
    <a href="index.html" class="logo">Ying</a>
    <a href="works.html" class="back-btn">← Back to Works</a>
  </nav>

  <main>
    <header class="project-hero">
      <h1 class="project-title">青鳥運動</h1>
      <p class="project-date">2024.05</p>
    </header>

    <section class="gallery-container">
      <!-- 1: 單張滿版 -->
      <div class="grid-row col-1">
        <div class="photo-item"><img src="./images/work-18/work-18-1.jpg" alt="青鳥運動 1" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>

      <!-- 2, 3, 4: 三張並排 -->
      <div class="grid-row col-3">
        <div class="photo-item"><img src="./images/work-18/work-18-2.jpg" alt="青鳥運動 2" onerror="this.parentNode.classList.add('image-placeholder')"></div>
        <div class="photo-item"><img src="./images/work-18/work-18-3.jpg" alt="青鳥運動 3" onerror="this.parentNode.classList.add('image-placeholder')"></div>
        <div class="photo-item"><img src="./images/work-18/work-18-4.jpg" alt="青鳥運動 4" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>

      <!-- 5, 6: 兩張並排 -->
      <div class="grid-row col-2">
        <div class="photo-item"><img src="./images/work-18/work-18-5.jpg" alt="青鳥運動 5" onerror="this.parentNode.classList.add('image-placeholder')"></div>
        <div class="photo-item"><img src="./images/work-18/work-18-6.jpg" alt="青鳥運動 6" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>

      <!-- 7: 單張滿版 -->
      <div class="grid-row col-1">
        <div class="photo-item"><img src="./images/work-18/work-18-7.jpg" alt="青鳥運動 7" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>

      <!-- 8, 9: 兩張並排 -->
      <div class="grid-row col-2">
        <div class="photo-item"><img src="./images/work-18/work-18-8.jpg" alt="青鳥運動 8" onerror="this.parentNode.classList.add('image-placeholder')"></div>
        <div class="photo-item"><img src="./images/work-18/work-18-9.jpg" alt="青鳥運動 9" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>

      <!-- 10, 11: 兩張並排 -->
      <div class="grid-row col-2">
        <div class="photo-item"><img src="./images/work-18/work-18-10.jpg" alt="青鳥運動 10" onerror="this.parentNode.classList.add('image-placeholder')"></div>
        <div class="photo-item"><img src="./images/work-18/work-18-11.jpg" alt="青鳥運動 11" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>

      <!-- 12, 13, 14: 三張並排 -->
      <div class="grid-row col-3">
        <div class="photo-item"><img src="./images/work-18/work-18-12.jpg" alt="青鳥運動 12" onerror="this.parentNode.classList.add('image-placeholder')"></div>
        <div class="photo-item"><img src="./images/work-18/work-18-13.jpg" alt="青鳥運動 13" onerror="this.parentNode.classList.add('image-placeholder')"></div>
        <div class="photo-item"><img src="./images/work-18/work-18-14.jpg" alt="青鳥運動 14" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>

      <!-- 15, 16: 兩張並排 -->
      <div class="grid-row col-2">
        <div class="photo-item"><img src="./images/work-18/work-18-15.jpg" alt="青鳥運動 15" onerror="this.parentNode.classList.add('image-placeholder')"></div>
        <div class="photo-item"><img src="./images/work-18/work-18-16.jpg" alt="青鳥運動 16" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>

      <!-- 17: 單張滿版 -->
      <div class="grid-row col-1">
        <div class="photo-item"><img src="./images/work-18/work-18-17.jpg" alt="青鳥運動 17" onerror="this.parentNode.classList.add('image-placeholder')"></div>
      </div>
    </section>

    <!-- 頁尾導覽按鈕區 (含 Back to Top) -->
    <footer class="project-footer-nav">
      <span class="back-btn" onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">↑ Back to Top</span>
    </footer>

    <!-- 隨機推薦專案區塊 (MORE WORKS / 2x2 Grid) -->
    <section class="recommend-section">
      <h2 class="recommend-title">More Works</h2>
      <div class="recommend-grid" id="recommend-grid">
        <!-- 由 JavaScript 動態生成 4 個推薦專題 -->
      </div>
    </section>
  </main>

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // 頁面轉場淡入
    const overlay = document.getElementById('transition-overlay');

    window.addEventListener('DOMContentLoaded', () => {
      window.scrollTo(0, 0);
      setTimeout(() => {
        if (overlay) overlay.classList.add('hidden');
      }, 100);
    });

    window.addEventListener('pageshow', () => {
      if (overlay) overlay.classList.add('hidden');
    });

    // 動態綁定轉場動畫至連結
    function bindTransitionLinks() {
      document.querySelectorAll('a[href]').forEach(anchor => {
        if (anchor.dataset.bound) return;
        anchor.dataset.bound = "true";

        const href = anchor.getAttribute('href');
        const target = anchor.getAttribute('target');

        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && target !== '_blank') {
          anchor.addEventListener('click', function (e) {
            e.preventDefault();

            if (overlay) {
              overlay.classList.remove('hidden');
              setTimeout(() => {
                window.location.href = href;
              }, 350);
            } else {
              window.location.href = href;
            }
          });
        }
      });
    }

    // ----------------------------------------------------
    // 動態推薦專案（排除當前頁面，隨機抽最多 4 個）
    // ----------------------------------------------------
    const CURRENT_WORK_ID = "work-18";

    const allProjects = [
      { id: "work-1", title: "老鐵舖的餘溫", date: "2025.04.14", url: "work-1.html", cover: "./images/work-1/work-1-16.jpg" },
      { id: "work-2", title: "2025馬祖國際藝術島", date: "2025.11.07-10", url: "work-2.html", cover: "./images/work-2/work-2-29.jpg" },
      { id: "work-3", title: "228・0紀念行動", date: "2026.02.27", url: "work-3.html", cover: "./images/work-3/work-3-7.jpg" },
      { id: "work-4", title: "台北迎城隍系列", date: "2026.06.25、27", url: "work-4.html", cover: "./images/work-4/暗訪夜巡-1.jpg" },
      { id: "work-5", title: "與大道公等雨", date: "2026.06.22", url: "work-5.html", cover: "./images/work-5/work-5.jpg" },
      { id: "work-6", title: "浪漫屋", date: "2026.07.06", url: "work-6.html", cover: "./images/work-6/work-6-1.jpg" },
      { id: "work-11", title: "發美皮鞋店", date: "2025.05.03", url: "work-11.html", cover: "./images/work-11/work-11-1.jpg" },
      { id: "work-12", title: "台日友好 青森睡魔抵嘉", date: "2026.02.07 / 03.06", url: "work-12.html", cover: "./images/work-12/work-12-1.jpg" },
      { id: "work-13", title: "鹿港國際龍舟錦標賽", date: "2026.06.19", url: "work-13.html", cover: "./images/work-13/work-13-1.jpg" },
      { id: "work-14", title: "雞籠中元祭", date: "2026.06.19", url: "work-14.html", cover: "./images/work-14/work-14-1.jpg" },
      { id: "work-15", title: "溪洲記事：溪洲部落豐年祭", date: "2026.07/08", url: "work-15-index.html", cover: "./images/work-15/work-15-4-29.jpg" },
      { id: "work-16", title: "跟著《臺灣漫遊錄》吃遍台灣", date: "2026", url: "work-16-index.html", cover: "./images/work-16/work-16-1.jpg" },
      { id: "work-17", title: "日進花影 活水營新竹篇", date: "2026.05.14", url: "work-17.html", cover: "./images/work-17/work-17-1.jpg" },
      { id: "work-18", title: "青鳥運動", date: "2024.05", url: "work-18.html", cover: "./images/work-18/work-18-1.jpg" }
    ];

    function renderRecommendations() {
      const otherProjects = allProjects.filter(p => p.id !== CURRENT_WORK_ID);
      
      for (let i = otherProjects.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [otherProjects[i], otherProjects[j]] = [otherProjects[j], otherProjects[i]];
      }

      const selected = otherProjects.slice(0, 4);

      const grid = document.getElementById('recommend-grid');
      if (!grid) return;

      grid.innerHTML = selected.map(p => `
        <a href="${p.url}" class="recommend-card">
          <div class="recommend-image">
            <img src="${p.cover}" alt="${p.title}" onerror="this.parentNode.classList.add('image-placeholder')">
          </div>
          <div class="recommend-info">
            <h3 class="recommend-info-title">${p.title}</h3>
            <span class="recommend-info-date">${p.date}</span>
          </div>
        </a>
      `).join('');

      bindTransitionLinks();
    }

    renderRecommendations();

    // Lightbox Modal
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('image-modal-img');
    const modalClose = document.getElementById('image-modal-close');

    document.querySelectorAll('.photo-item img').forEach(img => {
      img.addEventListener('click', () => {
        if (img.src) {
          modalImg.src = img.src;
          modalImg.alt = img.alt || '';
          modal.classList.add('active');
        }
      });
    });

    function closeModal() {
      if (modal) modal.classList.remove('active');
    }

    if (modal) modal.addEventListener('click', closeModal);
    if (modalClose) modalClose.addEventListener('click', closeModal);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
