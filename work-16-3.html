<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S067NREK0J"></script>

  <title>Ep.3 — 跟著《臺灣漫遊錄》吃遍台灣</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@p3ol/gen-yo-min-tc@1.0.0/index.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "GenYoMin TC", "GenYoMinTC-Regular", "Noto Serif TC", serif;
      background: #f5f4f3;
      color: #111111;
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 全螢幕轉場白幕 */
    .page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f5f4f3;
      z-index: 9999;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .page-transition-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* 固定頁首導覽列 */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      mix-blend-mode: difference;
      color: white;
    }

    nav .logo {
      font-size: 15px;
      letter-spacing: 0.08em;
      font-family: "Cormorant Garamond", serif;
    }

    .back-btn {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.6;
    }

    /* 專題 Header 區塊 */
    .project-hero {
      padding: 140px 32px 40px;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .project-subtitle {
      font-size: 14px;
      letter-spacing: 0.15em;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .project-title {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .project-date {
      font-size: 14px;
      color: #777;
      font-family: Arial, sans-serif;
      letter-spacing: 0.05em;
    }

    /* 9:16 直式 Reels 影片專用容器 */
    .reel-video-wrapper {
      max-width: 380px; /* 大螢幕最適宜觀看寬度 */
      width: 100%;
      margin: 0 auto 100px;
      padding: 0 20px;
    }

    .reel-video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16; /* 9:16 直式比例 */
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      background: #000000;
    }

    .reel-video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* 占位符樣式 */
    .image-placeholder {
      position: relative;
    }

    .image-placeholder::after {
      content: "IMAGE MISSING";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #999;
    }

    /* 推薦區塊 (MORE WORKS) */
    .recommend-section {
      padding: 80px 32px 60px;
      max-width: 1200px;
      margin: 0 auto;
      border-top: 1px solid #e0dfdd;
    }

    .recommend-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(32px, 4vw, 48px);
      margin-bottom: 32px;
      font-weight: 400;
    }

    .recommend-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .recommend-card {
      display: block;
    }

    .recommend-image {
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #e8e8e8;
      margin-bottom: 16px;
    }

    .recommend-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .recommend-card:hover .recommend-image img {
      transform: scale(1.05);
    }

    .recommend-info-title {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 4px;
    }

    .recommend-info-date {
      font-size: 12px;
      color: #777;
    }

    /* RWD 微調 */
    @media (max-width: 768px) {
      nav, .project-hero, .recommend-section {
        padding-left: 20px;
        padding-right: 20px;
      }

      .project-hero {
        padding-top: 110px;
        padding-bottom: 30px;
      }

      .recommend-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page-transition-overlay" id="transition-overlay"></div>

  <nav>
    <a href="index.html" class="logo">Ying</a>
    <a href="work-16-index.html" class="back-btn">← Back</a>
  </nav>

  <main>
    <!-- 標題與副標題 (保持同 style) -->
    <header class="project-hero">
      <p class="project-subtitle">跟著《臺灣漫遊錄》吃遍台灣</p>
      <h1 class="project-title">Ch.3 咖哩</h1>
      <p class="project-date">2026.09</p>
    </header>

    <!-- 9:16 YouTube Shorts / Reels 影框區塊 -->
    <div class="reel-video-wrapper">
      <div class="reel-video-container">
        <!-- 請將 YOUR_YOUTUBE_VIDEO_ID 替換為實際的 YouTube Shorts 或影片 ID -->
        <iframe 
          src="https://www.youtube.com/embed/EJD4BPakBXI" 
          title="Ep.3 Reels" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 推薦區塊 (MORE WORKS) -->
    <section class="recommend-section">
      <h2 class="recommend-title">More Works</h2>
      <div class="recommend-grid" id="recommend-grid">
      </div>
    </section>

  </main>

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // 頁面淡入轉場
    const overlay = document.getElementById('transition-overlay');

    window.addEventListener('DOMContentLoaded', () => {
      window.scrollTo(0, 0);
      setTimeout(() => {
        if (overlay) overlay.classList.add('hidden');
      }, 100);
    });

    window.addEventListener('pageshow', () => {
      if (overlay) overlay.classList.add('hidden');
    });

    function bindTransitionLinks() {
      document.querySelectorAll('a[href]').forEach(anchor => {
        const href = anchor.getAttribute('href');
        const target = anchor.getAttribute('target');

        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && target !== '_blank') {
          anchor.addEventListener('click', function (e) {
            e.preventDefault();

            if (overlay) {
              overlay.classList.remove('hidden');
              setTimeout(() => {
                window.location.href = href;
              }, 350);
            } else {
              window.location.href = href;
            }
          });
        }
      });
    }

    // 動態推薦專案（排除當前 work-16，加入其他專案）
    const CURRENT_WORK_ID = "work-16";

    const allProjects = [
      { id: "work-1", title: "老鐵舖的餘溫", date: "2025.04.14", url: "work-1.html", cover: "./images/work-1/work-1-16.jpg" },
      { id: "work-2", title: "2025馬祖國際藝術島", date: "2025.11.07-10", url: "work-2.html", cover: "./images/work-2/work-2-29.jpg" },
      { id: "work-3", title: "228・0紀念行動", date: "2026.02.27", url: "work-3.html", cover: "./images/work-3/work-3-7.jpg" },
      { id: "work-4", title: "台北迎城隍系列", date: "2026.06.25、27", url: "work-4.html", cover: "./images/work-4/暗訪夜巡-1.jpg" },
      { id: "work-5", title: "與大道公等雨", date: "2026.06.22", url: "work-5.html", cover: "./images/work-5/work-5.jpg" },
      { id: "work-6", title: "浪漫屋", date: "2026.07.06", url: "work-6.html", cover: "./images/work-6/work-6-1.jpg" },
      { id: "work-11", title: "發美皮鞋店", date: "2025.05.03", url: "work-11.html", cover: "./images/work-11/work-11-1.jpg" },
      { id: "work-12", title: "台日友好 青森睡魔抵嘉", date: "2026.02.07 / 03.06", url: "work-12.html", cover: "./images/work-12/work-12-1.jpg" },
      { id: "work-13", title: "鹿港國際龍舟錦標賽", date: "2026.06.19", url: "work-13.html", cover: "./images/work-13/work-13-1.jpg" },
      { id: "work-14", title: "雞籠中元祭", date: "2026.06.19", url: "work-14.html", cover: "./images/work-14/work-14-1.jpg" },
      { id: "work-15", title: "溪洲記事：溪洲部落豐年祭", date: "2026.07/08", url: "work-15-index.html", cover: "./images/work-15/work-15-4-29.jpg" },
      { id: "work-16", title: "跟著《臺灣漫遊錄》吃遍台灣", date: "2026", url: "work-16-index.html", cover: "./images/work-16/work-16-1.jpg" },
      { id: "work-17", title: "日進花影 活水營新竹篇", date: "2026.05.14", url: "work-17.html", cover: "./images/work-17/work-17-1.jpg" },
      { id: "work-18", title: "青鳥運動", date: "2024.05", url: "work-18.html", cover: "./images/work-18/work-18-1.jpg" }
    ];

    function renderRecommendations() {
      const otherProjects = allProjects.filter(p => p.id !== CURRENT_WORK_ID);
      for (let i = otherProjects.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [otherProjects[i], otherProjects[j]] = [otherProjects[j], otherProjects[i]];
      }

      const selected = otherProjects.slice(0, 4);

      const grid = document.getElementById('recommend-grid');
      if (!grid) return;

      grid.innerHTML = selected.map(p => `
        <a href="${p.url}" class="recommend-card">
          <div class="recommend-image">
            <img src="${p.cover}" alt="${p.title}" onerror="this.parentNode.classList.add('image-placeholder')">
          </div>
          <div class="recommend-info">
            <h3 class="recommend-info-title">${p.title}</h3>
            <span class="recommend-info-date">${p.date}</span>
          </div>
        </a>
      `).join('');

      bindTransitionLinks();
    }

    renderRecommendations();
  </script>
</body>
</html>
